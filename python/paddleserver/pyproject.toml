[project]
authors = [
    {name = "Zhengyuan Zhang", email = "zhangzhengyuan0604@gmail.com"},
]
license = {text = "Apache-2.0"}
requires-python = "<3.14,>=3.10"
dependencies = [
    "kserve @ file:///${PROJECT_ROOT}/../kserve",
    "kserve-storage @ file:///${PROJECT_ROOT}/../storage",
    "paddlepaddle>=2.6.1,<=3.0.0; platform_system != 'Windows' and platform_machine != 'ppc64le'",
    "setuptools<71.0.0,>=70.0.0",
    # IBM Power (ppc64le)
    # add transitive dependencies as top-level dependency for uv to resolve it on ppc64le with explicit index
    "google-crc32c ; platform_machine == 'ppc64le'",
    "hf-xet",
]
name = "paddleserver"
version = "0.21.0rc1"
description = "Model Server implementation for Paddle. Not intended for use outside KServe Frameworks Images"
readme = "README.md"

[dependency-groups]
test = [
    "pytest<8.0.0,>=7.4.4",
    "pytest-cov<6.0.0,>=5.0.0",
    "mypy<1.0,>=0.991",
    "opencv-python<5.0.0,>=4.10.0",
]
dev = [
    "black[colorama]>=26.3.1,<27",
]

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = ["sys_platform == 'linux' and platform_machine == 'ppc64le'"]

[[tool.uv.index]]
name = "ibm-ppc64le"
url = "https://wheels.developerfirst.ibm.com/ppc64le/linux/+simple/"
explicit = true

[tool.uv.sources]
google-crc32c = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
hf-xet        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
grpcio        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
grpcio-tools  = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
numpy         = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
pandas        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
pyyaml        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
