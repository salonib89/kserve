[project]
authors = [
    {name = "Ellis Tarn", email = "ellisbigelow@google.com"},
]
license = {text = "Apache-2.0"}
requires-python = "<3.14,>=3.10"
dependencies = [
    "kserve @ file:///${PROJECT_ROOT}/../kserve",
    "kserve-storage @ file:///${PROJECT_ROOT}/../storage",
    "xgboost~=2.1.1",

    # IBM Power (ppc64le)
    # add transitive dependencies as top-level dependency for uv to resolve it on ppc64le with explicit index
    "google-crc32c ; platform_machine == 'ppc64le'",
    "hf-xet ; platform_machine == 'ppc64le'",
    "scipy ; platform_machine == 'ppc64le'",
]
name = "xgbserver"
version = "0.21.0"
description = "Model Server implementation for XGBoost. Not intended for use outside KServe Frameworks Images."
readme = "README.md"

[dependency-groups]
test = [
    "scikit-learn~=1.5.1",
    "pytest<8.0.0,>=7.4.4",
    "pytest-cov<6.0.0,>=5.0.0",
    "mypy<1.0,>=0.991",
    "pytest-asyncio<1.0.0,>=0.23.4",
]
dev = [
    "black[colorama]>=26.3.1,<27",
]

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = ["sys_platform == 'linux' and platform_machine == 'ppc64le'"]

[[tool.uv.index]]
name = "ibm-ppc64le"
url = "https://wheels.developerfirst.ibm.com/ppc64le/linux/+simple/"
explicit = true

[tool.uv.sources]
# IBM Power (ppc64le)
# Explicitly use the IBM index when resolving the following packages on ppc64le
xgboost       = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
numpy         = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
scipy         = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
pandas        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
psutil        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
pyyaml        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
uvloop        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
httptools     = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
google-crc32c = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
hf-xet        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
pillow        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
grpcio        = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
grpcio-tools  = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
